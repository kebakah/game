<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">

<meta property="og:title" content="ትንሹ ቁጥር - ጨዋታ">
<meta property="og:description" content="ከ1.00 እስከ 1000.00 ትንሹን ልዩ ቁጥር ገምተህ ሽልማት አሸንፍ! ኢርፎን፣ ስልክ፣ ቲቪ እና ሌሎችም።">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%AF</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.1/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.1/firebase-firestore-compat.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF7F0;
    --ink:#1F2A24;
    --ink-soft:#54615A;
    --gold:#E8A93B;
    --gold-dark:#C98C22;
    --gold-grad:linear-gradient(135deg,#F5C77A,#E8A93B 55%,#C98C22);
    --teal:#1B6B5A;
    --teal-dark:#134F42;
    --teal-grad:linear-gradient(135deg,#238C74,#1B6B5A 70%,#134F42);
    --teal-soft:#E4F1EC;
    --red:#C1523D;
    --red-soft:#F7E7E2;
    --amber-soft:#FBF0DA;
    --line:#E4DCCB;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 10% -8%, rgba(232,169,59,.18), transparent 40%),
      radial-gradient(circle at 95% 6%, rgba(27,107,90,.14), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(27,107,90,.08), transparent 50%),
      var(--cream);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Noto Sans Ethiopic','Work Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:78px;
  }
  h1,h2,h3,.serif{ font-family:'Noto Serif Ethiopic',serif; }
  #app{ max-width:520px; margin:0 auto; min-height:100vh; position:relative; animation:fadeIn .3s ease; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:translateY(0);} }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:20px 18px 14px; }
  .brand{ display:flex; flex-direction:column; }
  .brand-row{ display:flex; align-items:center; gap:9px; }
  .brand-logo{
    width:36px; height:36px; border-radius:11px; background:var(--gold-grad);
    display:flex; align-items:center; justify-content:center; font-size:19px;
    box-shadow:0 5px 12px rgba(201,140,34,.4);
  }
  .brand .name{ font-family:'Noto Serif Ethiopic',serif; font-weight:700; font-size:22px; letter-spacing:-0.01em; }
  .brand .sub{ font-size:12.5px; color:var(--ink-soft); margin-top:4px; }
  .topbar-right{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .icon-round-btn{ background:#fff; border:1px solid var(--line); border-radius:50%; width:38px; height:38px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); box-shadow:0 2px 6px rgba(31,42,36,.06); transition:transform .12s ease; }
  .icon-round-btn:active{ transform:scale(.92); }
  .icon-round-btn svg{ width:18px; height:18px; }

  /* ---- prize / round card ---- */
  .round-wrap{ padding:4px 18px 8px; }
  .prize-card{ background:var(--card); border-radius:20px; overflow:hidden; box-shadow:0 10px 28px rgba(31,42,36,.1); }
  .prize-media{ position:relative; }
  .prize-card img{ width:100%; height:210px; object-fit:cover; display:block; background:var(--amber-soft); }
  .prize-ribbon{
    position:absolute; top:12px; right:12px; background:var(--gold-grad); color:var(--ink);
    font-size:11.5px; font-weight:700; padding:7px 13px; border-radius:20px;
    box-shadow:0 4px 10px rgba(0,0,0,.18);
  }
  .prize-body{ padding:18px 18px 20px; }
  .prize-name{ font-family:'Noto Serif Ethiopic',serif; font-size:21px; font-weight:700; margin:0 0 6px; }
  .prize-desc{ font-size:13.5px; color:var(--ink-soft); line-height:1.55; margin-bottom:14px; }
  .stat-row{ display:flex; gap:10px; margin-bottom:16px; }
  .stat-box{ flex:1; background:var(--teal-soft); border-radius:14px; padding:11px 10px; text-align:center; transition:background .3s ease, box-shadow .3s ease; }
  .stat-box.timer{ background:var(--amber-soft); }
  .stat-box .stat-val{ font-family:'Noto Serif Ethiopic',serif; font-size:20px; font-weight:700; color:var(--teal); font-variant-numeric:tabular-nums; letter-spacing:.02em; }
  .stat-box.timer .stat-val{ color:var(--gold-dark); }
  .stat-box .stat-lbl{ font-size:10.5px; color:var(--ink-soft); margin-top:3px; }
  .stat-box.timer.urgent{ background:var(--red-soft); animation:pulseUrgent 1s ease-in-out infinite; }
  .stat-box.timer.urgent .stat-val{ color:var(--red); }
  @keyframes pulseUrgent{
    0%,100%{ box-shadow:0 0 0 0 rgba(193,82,61,.35); }
    50%{ box-shadow:0 0 0 7px rgba(193,82,61,0); }
  }
  .btn-primary{
    width:100%; background:var(--gold-grad); color:var(--ink); border:none; border-radius:13px;
    padding:15px; font-size:15.5px; font-weight:700; cursor:pointer; font-family:'Noto Sans Ethiopic',sans-serif;
    box-shadow:0 8px 18px rgba(201,140,34,.32); transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn-primary:active{ transform:scale(.98); box-shadow:0 4px 10px rgba(201,140,34,.28); }
  .hint-chip{ text-align:center; font-size:12px; color:var(--ink-soft); margin-top:11px; }
  .btn-secondary{ background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:14px; font-size:15px; font-weight:600; cursor:pointer; flex:1; }
  .btn-outline-teal{ background:#fff; border:1px solid var(--teal); color:var(--teal); }
  .btn-danger{ background:#fff; border:1px solid var(--red); color:var(--red); }
  button:disabled{ opacity:.45; cursor:not-allowed; }
  .no-round{ text-align:center; padding:60px 30px; color:var(--ink-soft); font-size:14.5px; background:var(--card); border-radius:20px; margin:4px 0; box-shadow:0 8px 22px rgba(31,42,36,.07); }
  .no-round .big-ic{ font-size:40px; display:block; margin-bottom:10px; }
  .no-round .serif{ font-size:19px; color:var(--ink); display:block; margin-bottom:6px; }

  /* ---- rules ---- */
  .rules-box{ margin:18px 18px 6px; background:var(--teal-soft); border-radius:18px; padding:16px 16px 14px; }
  .rules-box .rt{ font-weight:700; font-size:14px; color:var(--teal-dark); margin-bottom:12px; }
  .rule-item{ display:flex; align-items:flex-start; gap:10px; margin-bottom:11px; font-size:13px; line-height:1.6; color:var(--ink); }
  .rule-item:last-child{ margin-bottom:0; }
  .rule-ic{ flex-shrink:0; width:28px; height:28px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; box-shadow:0 2px 5px rgba(31,42,36,.08); }

  .section-title{ padding:22px 18px 8px; font-family:'Noto Serif Ethiopic',serif; font-size:17px; font-weight:700; }

  /* ---- forms ---- */
  .back-btn{ padding:16px 18px 0; }
  .back-btn button{ background:none; border:none; font-size:14px; color:var(--ink-soft); cursor:pointer; padding:0; font-family:'Noto Sans Ethiopic',sans-serif; }
  .form-wrap{ padding:18px 18px 110px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  .field .hint{ font-size:12px; color:var(--ink-soft); margin-top:5px; }
  .field input[type=text], .field input[type=number], .field input[type=tel]{
    width:100%; border:1.5px solid var(--line); border-radius:11px; padding:12px 13px; font-size:14.5px; font-family:'Noto Sans Ethiopic',sans-serif;
    transition:border-color .15s ease;
  }
  .field input:focus{ outline:none; border-color:var(--teal); }
  textarea{
    width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; font-family:'Noto Sans Ethiopic',sans-serif;
    font-size:14px; resize:vertical; min-height:70px; background:#fff;
  }
  .fixed-bar{
    position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto;
    background:var(--cream); border-top:1px solid var(--line); padding:12px 18px 16px;
    display:flex; gap:10px;
  }

  /* ---- payment ---- */
  .pay-wrap{ padding:22px 18px 110px; }
  .pay-summary{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:18px; }
  .pay-summary .row{ display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0; color:var(--ink-soft); }
  .pay-summary .row.total{ color:var(--ink); font-weight:700; font-size:15px; border-top:1px solid var(--line); margin-top:6px; padding-top:12px; }
  .telebirr-card{ background:var(--teal-grad); color:#fff; border-radius:18px; padding:20px; margin-bottom:16px; box-shadow:0 10px 24px rgba(27,107,90,.28); }
  .telebirr-card .tb-label{ font-size:12.5px; opacity:.9; margin-bottom:10px; font-weight:600; }
  .telebirr-number-row{ display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,.15); border-radius:11px; padding:12px 14px; margin-bottom:10px; }
  .telebirr-number{ font-family:'Noto Serif Ethiopic',serif; font-size:23px; font-weight:700; letter-spacing:0.02em; }
  .copy-btn{ background:#fff; color:var(--teal); border:none; border-radius:8px; padding:8px 12px; font-size:12.5px; font-weight:700; cursor:pointer; }
  .tb-steps{ font-size:13px; line-height:1.7; opacity:.97; margin:0; padding-right:18px; }
  .ref-note{ font-size:13px; background:rgba(255,255,255,.15); border-radius:9px; padding:10px 12px; margin-top:12px; }

  /* ---- upload ---- */
  .upload-wrap{ padding:22px 18px 110px; }
  .drop-zone{ border:1.5px dashed var(--line); border-radius:14px; background:var(--card); padding:30px 16px; text-align:center; cursor:pointer; margin-bottom:16px; }
  .drop-zone.has-file{ border-color:var(--teal); }
  .drop-zone svg{ margin-bottom:8px; }
  .drop-zone .dz-text{ font-size:13.5px; color:var(--ink-soft); }
  .receipt-preview{ width:100%; max-height:260px; object-fit:contain; border-radius:12px; margin-bottom:14px; background:#f4f4f4; }

  /* ---- entry / winners cards ---- */
  .entry-card{ background:var(--card); border:1px solid var(--line); border-radius:16px; margin:0 18px 14px; padding:16px; box-shadow:0 4px 14px rgba(31,42,36,.05); transition:transform .12s ease; }
  .entry-card:active{ transform:scale(.99); }
  .entry-card.winner{ border-color:var(--gold); background:linear-gradient(135deg,#FFF7E8,var(--amber-soft)); box-shadow:0 6px 18px rgba(201,140,34,.2); }
  .entry-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
  .entry-prize{ font-weight:700; font-size:14.5px; }
  .entry-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; font-variant-numeric:tabular-nums; }
  .status-badge{ font-size:11.5px; font-weight:700; padding:4px 11px; border-radius:20px; white-space:nowrap; }
  .status-pending_payment{ background:var(--amber-soft); color:var(--gold-dark); }
  .status-submitted{ background:var(--amber-soft); color:var(--gold-dark); }
  .status-confirmed{ background:var(--teal-soft); color:var(--teal); }
  .status-rejected{ background:var(--red-soft); color:var(--red); }
  .status-winner{ background:var(--gold-grad); color:var(--ink); }
  .winner-banner{ text-align:center; padding:54px 30px 20px; }
  .winner-banner .big-ic{ font-size:52px; display:block; margin-bottom:8px; }
  .winner-banner .serif{ font-size:22px; margin:6px 0 8px; }
  .winner-banner p{ color:var(--ink-soft); font-size:14px; line-height:1.6; }
  .empty{ text-align:center; color:var(--ink-soft); padding:50px 30px; font-size:14.5px; }
  .empty .serif{ font-size:19px; color:var(--ink); display:block; margin-bottom:6px; }

  .wcard{ display:flex; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); align-items:center; }
  .wcard .wtrophy{ font-size:22px; flex-shrink:0; width:26px; text-align:center; }
  .wcard img{ width:54px; height:54px; border-radius:12px; object-fit:cover; background:var(--amber-soft); box-shadow:0 3px 8px rgba(31,42,36,.1); }
  .wcard .wname{ font-weight:700; font-size:14px; }
  .wcard .wmeta{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .wcard .wguess{ font-family:'Noto Serif Ethiopic',serif; color:var(--teal); font-weight:700; font-size:15px; font-variant-numeric:tabular-nums; }

  /* ---- bottom tab nav ---- */
  .tabbar{ position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto; background:#fff; border-top:1px solid var(--line); display:flex; box-shadow:0 -4px 14px rgba(31,42,36,.05); }
  .tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 4px 8px; cursor:pointer; color:var(--ink-soft); font-size:11px; position:relative; transition:color .12s ease; }
  .tab.active{ color:var(--teal); }
  .tab svg{ width:20px; height:20px; }
  .tab .badge{ position:absolute; top:4px; right:22%; background:var(--red); color:#fff; font-size:10px; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px; }

  /* ---- admin ---- */
  .admin-subnav{ display:flex; gap:8px; padding:0 18px 12px; }
  .admin-subnav button{ flex:1; padding:9px; border-radius:10px; border:1px solid var(--line); background:#fff; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-soft); font-family:'Noto Sans Ethiopic',sans-serif; }
  .admin-subnav button.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .img-picker{ display:flex; gap:10px; align-items:center; }
  .img-picker img{ width:64px; height:64px; border-radius:10px; object-fit:cover; background:var(--amber-soft); }
  .file-btn{ border:1px solid var(--line); background:#fff; border-radius:10px; padding:10px 14px; font-size:13px; cursor:pointer; font-family:'Noto Sans Ethiopic',sans-serif; }
  .admin-entry{ background:var(--card); border:1px solid var(--line); border-radius:14px; margin:0 18px 12px; padding:14px; }
  .admin-entry .ae-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
  .admin-entry .ae-name{ font-weight:700; font-size:14px; }
  .admin-entry .ae-phone{ font-size:12.5px; color:var(--ink-soft); }
  .admin-entry .ae-guess{ font-family:'Noto Serif Ethiopic',serif; font-weight:700; color:var(--teal); font-size:20px; margin:6px 0; font-variant-numeric:tabular-nums; }
  .admin-entry img.receipt-thumb{ width:100%; max-height:220px; object-fit:contain; border-radius:10px; margin:8px 0; background:#f4f4f4; }
  .admin-actions{ display:flex; gap:8px; margin-top:10px; }
  .admin-actions button{ flex:1; border-radius:10px; padding:10px; font-size:13px; font-weight:600; cursor:pointer; font-family:'Noto Sans Ethiopic',sans-serif; }
  .kv{ display:flex; justify-content:space-between; font-size:13.5px; padding:6px 0; color:var(--ink-soft); }
  .kv b{ color:var(--ink); }
  .note-box{ background:var(--amber-soft); border-radius:10px; padding:12px 14px; font-size:13.5px; margin:12px 0; }
  .footer-note{ text-align:center; padding:26px 18px 10px; }
  .footer-note a{ color:var(--ink-soft); font-size:12px; text-decoration:underline; cursor:pointer; }
  .toast{ position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:10px; font-size:13px; z-index:999; opacity:0; transition:opacity .25s; pointer-events:none; }
  .toast.show{ opacity:1; }

  /* ---- confetti ---- */
  .confetti-piece{ position:absolute; top:-20px; border-radius:2px; }
  @keyframes confettiFall{ to{ transform:translateY(115vh) rotate(600deg); opacity:0; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ CONFIG ============ */
const ADMIN_PASSWORD = 'gebeya2024';
const TELEBIRR_NUMBER = '930533061';

/* ============ FIREBASE (shared project, dedicated game_ collections) ============ */
const firebaseConfig = {
  apiKey: "AIzaSyCAjISTEbYbPfbx-xCacA6aLGO5xBqpa58",
  authDomain: "eth-online-gebeya.firebaseapp.com",
  projectId: "eth-online-gebeya",
  storageBucket: "eth-online-gebeya.firebasestorage.app",
  messagingSenderId: "942316634673",
  appId: "1:942316634673:web:008804f66a36436a07cb10"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ============ STATE ============ */
const state = {
  screen: 'home',
  rounds: [],
  entries: [],
  player: JSON.parse(localStorage.getItem('game_player')||'null') || { name:'', phone:'' },
  myEntryIds: JSON.parse(localStorage.getItem('game_my_entries')||'[]'),
  isAdmin: sessionStorage.getItem('isAdmin')==='1',
  currentEntryId: null,
  viewingEntryId: null,
  pendingImageData: null,
  loaded: false,
  _roundsReady: false,
  _entriesReady: false,
};

/* ============ REALTIME SYNC ============ */
function _maybeFinishLoading(){
  if (state._roundsReady && state._entriesReady && !state.loaded){ state.loaded = true; render(); }
}
function setupRealtimeSync(){
  db.collection('game_rounds').orderBy('createdAt','desc').onSnapshot(snap=>{
    state.rounds = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    state._roundsReady = true;
    if (state.loaded) render(); else _maybeFinishLoading();
  }, err=>{ console.error(err); showToast('ዙሮችን መጫን አልተቻለም'); });

  db.collection('game_entries').orderBy('createdAt','desc').onSnapshot(snap=>{
    state.entries = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    state._entriesReady = true;
    if (state.loaded) render(); else _maybeFinishLoading();
  }, err=>{ console.error(err); showToast('ተሳታፊዎችን መጫን አልተቻለም'); });
}
async function fsSaveRound(r){ try{ await db.collection('game_rounds').doc(r.id).set(r); } catch(e){ console.error(e); showToast('ዙር ማስቀመጥ አልተቻለም'); } }
async function fsSaveEntry(e){ try{ await db.collection('game_entries').doc(e.id).set(e); } catch(e2){ console.error(e2); showToast('ተሳትፎ ማስቀመጥ አልተቻለም'); } }

/* ============ HELPERS ============ */
function fmt(n){ return Number(n).toLocaleString('en-US'); }
function fmtGuess(n){ return Number(n).toFixed(2); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function val(id){ const el=document.getElementById(id); return el ? el.value.trim() : ''; }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 1800); }
function go(screen){ state.screen = screen; render(); window.scrollTo(0,0); }
function savePlayer(name, phone){ state.player = { name, phone }; localStorage.setItem('game_player', JSON.stringify(state.player)); }
function addMyEntryLocal(id){ state.myEntryIds.push(id); localStorage.setItem('game_my_entries', JSON.stringify(state.myEntryIds)); }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return escapeHtml(s); }
function fmtCountdown(ms){
  if (ms<0) ms=0;
  const totalSec = Math.floor(ms/1000);
  const d = Math.floor(totalSec/86400);
  const h = Math.floor((totalSec%86400)/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  const p = n=>String(n).padStart(2,'0');
  if (d>0) return `${d} ${d===1?'ቀን':'ቀናት'} ${p(h)}:${p(m)}:${p(s)}`;
  return h>0 ? `${p(h)}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
}
function maskPhone(p){ p = String(p||''); return p.length>=6 ? p.slice(0,4)+'***'+p.slice(-2) : p; }
function parseGuessInput(str){
  if (str === '' || str === null || str === undefined) return null;
  const n = parseFloat(str);
  if (!isFinite(n)) return null;
  const rounded = Math.round(n*100)/100;
  if (rounded < 1 || rounded > 1000) return null;
  return rounded;
}
function resizeImageFile(file, maxW, cb){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function copyNumber(){
  if (navigator.clipboard) navigator.clipboard.writeText(TELEBIRR_NUMBER).then(()=>showToast('ቁጥሩ ተቀድቷል'));
  else showToast(TELEBIRR_NUMBER);
}

/* ============ CONFETTI ============ */
function launchConfetti(){
  const colors = ['#E8A93B','#1B6B5A','#C1523D','#F5C77A','#238C74'];
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9998;';
  for (let i=0;i<44;i++){
    const p = document.createElement('div');
    const size = 6+Math.random()*6;
    p.className = 'confetti-piece';
    p.style.left = (Math.random()*100)+'%';
    p.style.width = size+'px';
    p.style.height = (size*0.4)+'px';
    p.style.background = colors[i%colors.length];
    p.style.opacity = (0.7+Math.random()*0.3).toFixed(2);
    p.style.transform = `rotate(${Math.random()*360}deg)`;
    p.style.animation = `confettiFall ${(2.2+Math.random()*1.6).toFixed(2)}s linear ${(Math.random()*0.5).toFixed(2)}s forwards`;
    wrap.appendChild(p);
  }
  document.body.appendChild(wrap);
  setTimeout(()=>wrap.remove(), 4200);
}
let _confettiShownFor = null;
function maybeLaunchConfetti(){
  if (state.screen !== 'entry-detail') return;
  const e = state.entries.find(x=>x.id===state.viewingEntryId);
  if (e && e.status==='winner' && _confettiShownFor !== e.id){
    _confettiShownFor = e.id;
    launchConfetti();
  }
}

function tickTimer(){
  if (state.screen !== 'home') return;
  const round = getOpenRound();
  if (!round) return;
  const el = document.getElementById('countdownVal');
  const box = document.getElementById('timerBox');
  if (!el) return;
  const remain = round.endAt - Date.now();
  if (remain <= 0){ render(); return; }
  el.textContent = fmtCountdown(remain);
  if (box) box.classList.toggle('urgent', remain < 60000);
}

  const name = val('joinName'), phone = val('joinPhone');
  const guess = parseGuessInput(val('joinGuess'));
  if (!name || !phone){ showToast('ስም እና ስልክ ቁጥር ያስፈልጋል'); return; }
  if (guess === null){ showToast('ከ1.00 እስከ 1000.00 ትክክለኛ ቁጥር አስገባ'); return; }
  const round = getOpenRound();
  if (!round || Date.now() >= round.endAt){ showToast('ዙሩ ተጠናቋል'); go('home'); return; }
  savePlayer(name, phone);
  const entry = { id: uid().toUpperCase(), roundId: round.id, name, phone, guess, receipt:null, note:'', status:'pending_payment', createdAt: Date.now() };
  state.entries.unshift(entry);
  state.currentEntryId = entry.id;
  fsSaveEntry(entry);
  addMyEntryLocal(entry.id);
  go('pay');
}

      </div>
    </div>`;
  }).join('')}
  ${renderTabbar('myentry')}`;
}
function viewEntry(id){ state.viewingEntryId = id; go('entry-detail'); }
function renderEntryDetail(){
  const e = state.entries.find(x=>x.id===state.viewingEntryId);
  if (!e){ go('myentry'); return ''; }
  const round = state.rounds.find(r=>r.id===e.roundId);
  if (e.status === 'winner'){
    return `
    <div class="back-btn"><button onclick="go('myentry')">&rarr; የኔ ተሳትፎ</button></div>
    <div class="winner-banner">
      <span class="big-ic">🏆</span>
      <div class="serif">እንኳን ደስ አለህ! አሸንፈሃል</div>
      <p>ቁጥርህ <strong>${fmtGuess(e.guess)}</strong> ልዩ እና ትንሹ ነበር። ሽልማትህን (${round?escapeHtml(round.prizeName):''}) ለመቀበል በ ${TELEBIRR_NUMBER} በኩል ወይም በተመዘገበው ስልክ ቁጥርህ በኩል እንገናኝሃለን።</p>
    </div>
    <div class="fixed-bar"><button class="btn-primary" onclick="go('home')">ወደ ቤት ተመለስ</button></div>`;
  }
  return `
  <div class="back-btn"><button onclick="go('myentry')">&rarr; የኔ ተሳትፎ</button></div>
  <div class="pay-wrap">
    <div style="display:flex; justify-content:space-between; align-items:center; margin:10px 0 16px;">
      <h2 class="serif" style="margin:0;">ተሳትፎ #${e.id}</h2>
      <span class="status-badge status-${e.status}">${statusLabel(e.status)}</span>
    </div>
    <div class="kv"><span>ሽልማት</span><b>${round?escapeHtml(round.prizeName):'-'}</b></div>
    <div class="kv"><span>ቁጥርህ</span><b>${fmtGuess(e.guess)}</b></div>
    <div class="kv"><span>ስም</span><b>${escapeHtml(e.name)}</b></div>
    ${e.receipt ? `<img class="order-detail-receipt" style="width:100%; border-radius:12px; margin:14px 0;" src="${e.receipt}">` : ''}
    ${e.status==='pending_payment' ? `<div class="note-box">ክፍያ ገና አልተጠናቀቀም። ቀጥል ወደ ክፍያ ገጽ ሂድ።</div>` : ''}
    ${e.status==='rejected' ? `<div class="note-box">ክፍያህ ሊረጋገጥ አልቻለም። እባክህ ደረሰኝህን መልሰህ አረጋግጥ ወይም ድጋፍ አግኝ።</div>` : ''}
  </div>
  ${e.status==='pending_payment' ? `<div class="fixed-bar"><button class="btn-primary" onclick="state.currentEntryId='${e.id}'; go('pay')">ወደ ክፍያ ቀጥል</button></div>` : ''}`;
}

/* ============ WINNERS (PUBLIC HISTORY) ============ */
function renderWinners(){
  const closed = state.rounds.filter(r=>r.status==='closed').sort((a,b)=>(b.closedAt||0)-(a.closedAt||0));
  return `
  <div class="topbar"><div class="brand"><div class="name">ያለፉ አሸናፊዎች</div></div></div>
  ${closed.length===0 ? `<div class="empty"><span class="serif">እስካሁን አሸናፊ የለም</span>የመጀመሪያው ዙር ሲጠናቀቅ አሸናፊዎች እዚህ ይታያሉ።</div>` :
  closed.map(r=>{
    const winner = r.winnerEntryId ? state.entries.find(e=>e.id===r.winnerEntryId) : null;
    return `
    <div class="wcard">
      <span class="wtrophy">${winner ? '🏆' : '➖'}</span>
      <img src="${prizeImg(r)}">
      <div style="flex:1;">
        <div class="wname">${escapeHtml(r.prizeName)}</div>
        <div class="wmeta">${winner ? escapeHtml(winner.name)+' &middot; '+maskPhone(winner.phone) : 'ልዩ አሸናፊ አልነበረም'}</div>
      </div>
      ${winner ? `<div class="wguess">${fmtGuess(winner.guess)}</div>` : ''}
    </div>`;
  }).join('')}
  ${renderTabbar('winners')}`;
}

/* ============ ADMIN ============ */
function renderAdmin(){
  if (!state.isAdmin){ go('home'); return ''; }
  const sub = state._adminTab || 'round';
  return `
  <div class="section-title">አስተዳደር</div>
  <div class="admin-subnav">
    <button class="${sub==='round'?'active':''}" onclick="state._adminTab='round'; render();">የአሁኑ ዙር</button>
    <button class="${sub==='history'?'active':''}" onclick="state._adminTab='history'; render();">ታሪክ</button>
  </div>
  ${sub==='round' ? renderAdminRound() : renderAdminHistory()}
  ${renderTabbar('')}`;
}
function renderAdminRound(){
  const round = getOpenRound();
  if (!round){
    const img = state.pendingImageData;
    return `
    <div class="form-wrap" style="padding-top:4px;">
      <p style="color:var(--ink-soft); font-size:13.5px; margin:0 0 16px;">ምንም ክፍት ዙር የለም። አዲስ ዙር ጀምር።</p>
      <div class="field">
        <label>የሽልማት ምስል</label>
        <div class="img-picker">
          <img src="${img || 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22><rect width=%2260%22 height=%2260%22 fill=%22%23FBF0DA%22/></svg>'}">
          <button class="file-btn" onclick="document.getElementById('prizeImgFile').click()">ምስል ምረጥ</button>
          <input type="file" id="prizeImgFile" accept="image/*" style="display:none" onchange="onPrizeImageChosen(event)">
        </div>
      </div>
      <div class="field"><label>የሽልማት ስም</label><input type="text" id="prizeName" placeholder="ለምሳሌ፡ ኢርፎን / ስልክ / ቲቪ"></div>
      <div class="field"><label>የሽልማት መግለጫ (አማራጭ)</label><textarea id="prizeDesc" placeholder="አጭር መግለጫ"></textarea></div>
      <div class="field"><label>የመግቢያ ክፍያ (ብር)</label><input type="number" id="entryFee" placeholder="ለምሳሌ፡ 50"></div>
      <div class="field">
        <label>የዙር ቆይታ</label>
        <div style="display:flex; gap:8px;">
          <input type="number" id="durationVal" placeholder="ለምሳሌ፡ 2" style="flex:1;">
          <select id="durationUnit" style="flex:1; border:1.5px solid var(--line); border-radius:11px; padding:12px 13px; font-size:14.5px; font-family:'Noto Sans Ethiopic',sans-serif; background:#fff;">
            <option value="minutes">ደቂቃ</option>
            <option value="hours">ሰዓት</option>
            <option value="days" selected>ቀን</option>
          </select>
        </div>
      </div>
    </div>
    <div class="fixed-bar"><button class="btn-primary" onclick="createRound()">ዙር ጀምር</button></div>`;
  }
  const remain = round.endAt - Date.now();
  const entries = entriesForRound(round.id);
  return `
  <div class="round-wrap">
    <div class="prize-card">
      <div class="prize-media">
        <img src="${prizeImg(round)}" alt="">
        <div class="prize-ribbon">🏆 ${escapeHtml(round.prizeName)}</div>
      </div>
      <div class="prize-body">
        <div class="stat-row">
          <div class="stat-box timer"><div class="stat-val">${remain>0?fmtCountdown(remain):'00:00'}</div><div class="stat-lbl">ቀሪ ጊዜ</div></div>
          <div class="stat-box"><div class="stat-val">${entries.length}</div><div class="stat-lbl">ተሳታፊዎች</div></div>
          <div class="stat-box"><div class="stat-val">${entries.filter(e=>e.status==='confirmed').length}</div><div class="stat-lbl">የተረጋገጡ</div></div>
        </div>
        <button class="btn-danger" style="width:100%; border-radius:12px; padding:12px; font-weight:600;" onclick="closeRoundAndAnnounce()">ዙር ዝጋና አሸናፊ አውጅ</button>
      </div>
    </div>
  </div>
  <div class="section-title" style="padding-top:6px;">ተሳታፊዎች</div>
  ${entries.length===0 ? `<div class="empty">እስካሁን ተሳታፊ የለም።</div>` :
  entries.map(e=>`
    <div class="admin-entry">
      <div class="ae-top">
        <div><div class="ae-name">${escapeHtml(e.name)}</div><div class="ae-phone">${escapeHtml(e.phone)}</div></div>
        <span class="status-badge status-${e.status}">${statusLabel(e.status)}</span>
      </div>
      <div class="ae-guess">${fmtGuess(e.guess)}</div>
      ${e.note ? `<div class="note-box">"${escapeHtml(e.note)}"</div>` : ''}
      ${e.receipt ? `<img class="receipt-thumb" src="${e.receipt}">` : `<div style="font-size:12.5px; color:var(--ink-soft);">ደረሰኝ ገና አልገባም</div>`}
      ${e.status==='submitted' ? `
      <div class="admin-actions">
        <button class="btn-danger" onclick="setEntryStatus('${e.id}','rejected')">አትቀበል</button>
        <button class="btn-primary" style="flex:1;" onclick="setEntryStatus('${e.id}','confirmed')">አረጋግጥ</button>
      </div>` : ''}
    </div>`).join('')}`;
}
function onPrizeImageChosen(e){
  const file = e.target.files[0];
  if (!file) return;
  resizeImageFile(file, 700, (dataUrl)=>{ state.pendingImageData = dataUrl; render(); });
}
function createRound(){
  const prizeName = val('prizeName');
  const prizeDesc = val('prizeDesc');
  const entryFee = parseFloat(val('entryFee'));
  const durationVal = parseFloat(val('durationVal'));
  const durationUnit = (document.getElementById('durationUnit')||{}).value || 'minutes';
  const unitMinutes = { minutes:1, hours:60, days:1440 }[durationUnit] || 1;
  const durationMin = durationVal * unitMinutes;
  if (!prizeName){ showToast('የሽልማት ስም ያስፈልጋል'); return; }
  if (!entryFee || entryFee<=0){ showToast('ትክክለኛ የመግቢያ ክፍያ አስገባ'); return; }
  if (!durationVal || durationVal<=0){ showToast('ትክክለኛ የቆይታ ጊዜ አስገባ'); return; }
  const round = {
    id: uid(), prizeName, prizeDesc, prizeImage: state.pendingImageData || null,
    entryFee, durationMinutes: durationMin,
    startAt: Date.now(), endAt: Date.now() + durationMin*60000,
    status: 'open', winnerEntryId: null, createdAt: Date.now(),
  };
  state.rounds.unshift(round);
  fsSaveRound(round);
  state.pendingImageData = null;
  showToast('ዙር ተጀምሯል');
  render();
}
function setEntryStatus(id, status){
  const e = state.entries.find(x=>x.id===id);
  if (!e) return;
  e.status = status;
  fsSaveEntry(e);
  showToast(status==='confirmed' ? 'ተረጋግጧል' : 'ውድቅ ተደርጓል');
  render();
}
function closeRoundAndAnnounce(){
  const round = getOpenRound();
  if (!round) return;
  if (!confirm('ዙሩን ዘግተህ አሸናፊ ማወጅ ትፈልጋለህ?')) return;
  const confirmed = entriesForRound(round.id).filter(e=>e.status==='confirmed');
  const counts = {};
  confirmed.forEach(e=>{ counts[e.guess] = (counts[e.guess]||0) + 1; });
  const uniqueEntries = confirmed.filter(e=>counts[e.guess]===1).sort((a,b)=>a.guess-b.guess);
  const winner = uniqueEntries[0] || null;
  round.status = 'closed';
  round.closedAt = Date.now();
  round.winnerEntryId = winner ? winner.id : null;
  fsSaveRound(round);
  if (winner){ winner.status = 'winner'; fsSaveEntry(winner); }
  showToast(winner ? `🏆 አሸናፊ፡ ${winner.name} (${fmtGuess(winner.guess)})` : 'ልዩ አሸናፊ አልተገኘም');
  render();
}
function renderAdminHistory(){
  const closed = state.rounds.filter(r=>r.status==='closed').sort((a,b)=>(b.closedAt||0)-(a.closedAt||0));
  return closed.length===0 ? `<div class="empty">እስካሁን የተዘጋ ዙር የለም።</div>` :
  closed.map(r=>{
    const winner = r.winnerEntryId ? state.entries.find(e=>e.id===r.winnerEntryId) : null;
    const total = entriesForRound(r.id).length;
    return `
    <div class="admin-entry">
      <div class="ae-top">
        <div><div class="ae-name">${escapeHtml(r.prizeName)}</div><div class="ae-phone">${total} ተሳታፊዎች &middot; ${fmt(r.entryFee)} ብር</div></div>
      </div>
      ${winner ? `<div class="kv"><span>አሸናፊ</span><b>${escapeHtml(winner.name)} (${escapeHtml(winner.phone)}) &mdash; ${fmtGuess(winner.guess)}</b></div>` : `<div class="kv"><span>ውጤት</span><b>ልዩ አሸናፊ አልነበረም</b></div>`}
    </div>`;
  }).join('');
}

/* ============ ROUTER ============ */
function render(){
  const app = document.getElementById('app');
  if (!state.loaded){ app.innerHTML = `<div class="empty" style="padding-top:120px;"><span class="serif">በመጫን ላይ…</span></div>`; return; }
  const map = {
    'home': renderHome, 'join': renderJoin, 'pay': renderPay, 'upload': renderUpload, 'status': renderStatus,
    'myentry': renderMyEntry, 'entry-detail': renderEntryDetail, 'winners': renderWinners,
    'admin': renderAdmin,
  };
  const fn = map[state.screen] || renderHome;
  app.innerHTML = fn();
  maybeLaunchConfetti();
}

/* ============ BOOT ============ */
(function boot(){
  render();
  setupRealtimeSync();
})();
</script>
</body>
</html>
