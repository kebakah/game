<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ትንሹ ቁጥር - ጨዋታ</title>
<meta name="description" content="ከ1.00 እስከ 1000.00 ትንሹን ልዩ ቁጥር ገምተህ ሽልማት አሸንፍ! ኢርፎን፣ ስልክ፣ ቲቪ እና ሌሎችም።">
<meta property="og:title" content="ትንሹ ቁጥር - ጨዋታ">
<meta property="og:description" content="ከ1.00 እስከ 1000.00 ትንሹን ልዩ ቁጥር ገምተህ ሽልማት አሸንፍ! ኢርፎን፣ ስልክ፣ ቲቪ እና ሌሎችም።">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0A1620">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%AF</text></svg>">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.1/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.1/firebase-firestore-compat.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#0A1620;
    --ink:#E9F2F8;
    --ink-soft:#7E93A6;
    --ink-dark:#241A06;
    --gold:#E8A93B;
    --gold-dark:#C98C22;
    --gold-grad:linear-gradient(135deg,#F5C77A,#E8A93B 55%,#C98C22);
    --teal:#22DD79;
    --teal-dark:#0FAE59;
    --teal-grad:linear-gradient(135deg,#5CF0A4,#22DD79 60%,#0FAE59);
    --teal-soft:rgba(34,221,121,.14);
    --red:#FF5D74;
    --red-soft:rgba(255,93,116,.14);
    --amber-soft:rgba(232,169,59,.14);
    --line:#20323F;
    --card:#122431;
    --card-2:#1A2F3D;
    --shadow-sm:0 2px 10px rgba(0,0,0,.35);
    --shadow-md:0 10px 24px rgba(0,0,0,.45);
    --shadow-lg:0 18px 44px rgba(0,0,0,.55);
    --content-w:520px;
    --content-w-lg:880px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{ scroll-behavior:smooth; }
  body{
    background:
      radial-gradient(circle at 12% -6%, rgba(232,169,59,.16), transparent 42%),
      radial-gradient(circle at 92% 8%, rgba(34,221,121,.15), transparent 46%),
      radial-gradient(circle at 50% 105%, rgba(34,221,121,.09), transparent 55%),
      radial-gradient(circle, rgba(255,255,255,.045) 1px, transparent 1px) 0 0/24px 24px,
      var(--cream);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Inter','Noto Sans Ethiopic','Work Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:78px;
  }
  h1,h2,h3,.serif{ font-family:'Noto Serif Ethiopic',serif; }
  #app{ max-width:var(--content-w); margin:0 auto; min-height:100vh; position:relative; animation:fadeIn .35s ease; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }
  @keyframes slideFadeIn{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---- loading ---- */
  .loading-wrap{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding-top:38vh; color:var(--ink-soft); font-size:13.5px; }
  .spinner{ width:34px; height:34px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--teal); animation:spin .8s linear infinite; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between; padding:18px 18px;
    position:sticky; top:0; z-index:40;
    background:rgba(10,22,32,.78); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(32,50,63,.9);
  }
  .brand{ display:flex; flex-direction:column; }
  .brand-row{ display:flex; align-items:center; gap:9px; }
  .brand-logo{
    width:36px; height:36px; border-radius:11px; background:var(--gold-grad);
    display:flex; align-items:center; justify-content:center; font-size:19px;
    box-shadow:0 5px 12px rgba(201,140,34,.4);
  }
  .brand .name{
    font-family:'Noto Serif Ethiopic',serif; font-weight:700; font-size:22px; letter-spacing:-0.01em;
    background:linear-gradient(90deg,#C98C22 0%,#F5C77A 25%,#FFF3D6 50%,#F5C77A 75%,#C98C22 100%);
    background-size:250% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:nameShimmer 6s linear infinite;
  }
  @keyframes nameShimmer{ 0%{ background-position:0% 50%; } 100%{ background-position:-250% 50%; } }
  .brand .sub{ font-size:12.5px; color:var(--ink-soft); margin-top:4px; }
  .topbar-right{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .icon-round-btn{ background:var(--card); border:1px solid var(--line); border-radius:50%; width:38px; height:38px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); box-shadow:var(--shadow-sm); transition:transform .12s ease, box-shadow .15s ease, color .15s ease; }
  .icon-round-btn:hover{ color:var(--teal); box-shadow:var(--shadow-md); transform:translateY(-1px); }
  .icon-round-btn:active{ transform:scale(.92); }
  .icon-round-btn svg{ width:18px; height:18px; }
  .lang-select{
    background:var(--card); border:1px solid var(--line); color:var(--ink-soft); border-radius:20px;
    padding:8px 10px; font-size:12px; font-weight:700; cursor:pointer; box-shadow:var(--shadow-sm);
    font-family:'Noto Sans Ethiopic',sans-serif; -webkit-appearance:none; appearance:none;
  }

  /* ---- prize / round card ---- */
  .round-wrap{ padding:8px 18px 8px; display:grid; grid-template-columns:1fr; gap:16px; }
  .prize-card{
    background:var(--card); border-radius:20px; overflow:hidden; box-shadow:var(--shadow-lg);
    animation:slideFadeIn .4s ease backwards; transition:transform .18s ease, box-shadow .18s ease;
  }
  .prize-card:hover{ transform:translateY(-3px); box-shadow:0 20px 46px rgba(0,0,0,.6), 0 0 0 1px rgba(232,169,59,.18); }
  .round-wrap .prize-card:nth-child(1){ animation-delay:.03s; }
  .round-wrap .prize-card:nth-child(2){ animation-delay:.08s; }
  .round-wrap .prize-card:nth-child(3){ animation-delay:.13s; }
  .round-wrap .prize-card:nth-child(4){ animation-delay:.18s; }
  .prize-media{ position:relative; }
  .prize-card img{ width:100%; height:210px; object-fit:cover; display:block; background:var(--amber-soft); }
  .prize-ribbon{
    position:absolute; top:12px; right:12px; background:var(--gold-grad); color:var(--ink-dark);
    font-size:11.5px; font-weight:700; padding:7px 13px; border-radius:20px;
    box-shadow:0 4px 10px rgba(0,0,0,.4);
  }
  .prize-body{ padding:18px 18px 20px; }
  .prize-name{ font-family:'Noto Serif Ethiopic',serif; font-size:21px; font-weight:700; margin:0 0 6px; }
  .prize-desc{ font-size:13.5px; color:var(--ink-soft); line-height:1.55; margin-bottom:14px; }
  .stat-row{ display:flex; gap:10px; margin-bottom:16px; }
  .stat-box{ flex:1; background:var(--teal-soft); border-radius:14px; padding:11px 10px; text-align:center; transition:background .3s ease, box-shadow .3s ease; }
  .stat-box.timer{ background:var(--amber-soft); }
  .stat-box .stat-val{ font-family:'Inter','Noto Serif Ethiopic',serif; font-size:19px; font-weight:800; color:var(--teal); font-variant-numeric:tabular-nums; letter-spacing:.01em; }
  .stat-box.timer .stat-val{ color:var(--gold); }
  .stat-box .stat-lbl{ font-size:10.5px; color:var(--ink-soft); margin-top:3px; }
  .stat-box.timer.urgent{ background:var(--red-soft); animation:pulseUrgent 1s ease-in-out infinite; }
  .stat-box.timer.urgent .stat-val{ color:var(--red); }
  @keyframes pulseUrgent{
    0%,100%{ box-shadow:0 0 0 0 rgba(193,82,61,.35); }
    50%{ box-shadow:0 0 0 7px rgba(193,82,61,0); }
  }
  /* progress bar (confirmed vs total entries) */
  .progress-track{ background:var(--teal-soft); border-radius:20px; height:8px; overflow:hidden; margin-top:10px; }
  .progress-fill{ height:100%; background:var(--teal-grad); border-radius:20px; transition:width .4s ease; }
  .progress-lbl{ font-size:11px; color:var(--ink-soft); margin-top:6px; display:flex; justify-content:space-between; }

  .btn-primary{
    width:100%; background:var(--gold-grad); background-size:200% 200%; color:var(--ink-dark); border:none; border-radius:13px;
    padding:15px; font-size:15.5px; font-weight:700; cursor:pointer; font-family:'Noto Sans Ethiopic',sans-serif;
    box-shadow:0 8px 22px rgba(232,169,59,.28); transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
    animation:shimmerGold 5s ease-in-out infinite;
  }
  @keyframes shimmerGold{ 0%,100%{ background-position:0% 50%; } 50%{ background-position:100% 50%; } }
  .btn-primary:hover:not(:disabled){ filter:brightness(1.08); transform:translateY(-1px); box-shadow:0 10px 26px rgba(232,169,59,.4); }
  .btn-primary:active:not(:disabled){ transform:scale(.98); box-shadow:0 4px 12px rgba(232,169,59,.3); }
  .hint-chip{ text-align:center; font-size:12px; color:var(--ink-soft); margin-top:11px; }
  .btn-secondary{ background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:14px; font-size:15px; font-weight:600; cursor:pointer; flex:1; transition:transform .12s ease, border-color .15s ease; }
  .btn-secondary:hover{ border-color:var(--teal); transform:translateY(-1px); }
  .btn-outline-teal{ background:var(--card); border:1px solid var(--teal); color:var(--teal); }
  .btn-danger{ background:var(--card); border:1px solid var(--red); color:var(--red); transition:transform .12s ease, background .15s ease; }
  .btn-danger:hover{ background:var(--red-soft); transform:translateY(-1px); }
  button{ font-family:'Noto Sans Ethiopic',sans-serif; }
  button:disabled{ opacity:.45; cursor:not-allowed; }
  .no-round{ text-align:center; padding:60px 30px; color:var(--ink-soft); font-size:14.5px; background:var(--card); border-radius:20px; margin:4px 0; box-shadow:var(--shadow-md); }
  .no-round .big-ic{ font-size:40px; display:block; margin-bottom:10px; }
  .no-round .serif{ font-size:19px; color:var(--ink); display:block; margin-bottom:6px; }

  /* ---- rules ---- */
  .rules-box{ margin:18px 18px 6px; background:var(--teal-soft); border-radius:18px; padding:16px 16px 14px; }
  .rules-box .rt{ font-weight:700; font-size:14px; color:var(--teal-dark); margin-bottom:12px; }
  .rule-item{ display:flex; align-items:flex-start; gap:10px; margin-bottom:11px; font-size:13px; line-height:1.6; color:var(--ink); }
  .rule-item:last-child{ margin-bottom:0; }
  .rule-ic{ flex-shrink:0; width:28px; height:28px; border-radius:50%; background:var(--card-2); display:flex; align-items:center; justify-content:center; font-size:14px; box-shadow:0 2px 6px rgba(0,0,0,.3); }

  .section-title{ padding:22px 18px 8px; font-family:'Noto Serif Ethiopic',serif; font-size:17px; font-weight:700; }

  /* ---- forms ---- */
  .back-btn{ padding:16px 18px 0; }
  .back-btn button{ background:none; border:none; font-size:14px; color:var(--ink-soft); cursor:pointer; padding:0; font-family:'Noto Sans Ethiopic',sans-serif; transition:color .12s ease; }
  .back-btn button:hover{ color:var(--teal); }
  .form-wrap{ padding:18px 18px 110px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  .field .hint{ font-size:12px; color:var(--ink-soft); margin-top:5px; }
  .field input[type=text], .field input[type=number], .field input[type=tel]{
    width:100%; border:1.5px solid var(--line); border-radius:11px; padding:12px 13px; font-size:14.5px; font-family:'Noto Sans Ethiopic',sans-serif;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus{ outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(34,221,121,.16); }
  .field input[type=text], .field input[type=number], .field input[type=tel]{ background:var(--card-2); color:var(--ink); }
  textarea{
    width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; font-family:'Noto Sans Ethiopic',sans-serif;
    font-size:14px; resize:vertical; min-height:70px; background:var(--card-2); color:var(--ink); transition:border-color .15s ease, box-shadow .15s ease;
  }
  textarea:focus{ outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(34,221,121,.16); }
  .fixed-bar{
    position:fixed; bottom:0; left:0; right:0; max-width:var(--content-w); margin:0 auto;
    background:rgba(10,22,32,.88); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line); padding:12px 18px 16px;
    display:flex; gap:10px;
  }

  /* ---- payment ---- */
  .pay-wrap{ padding:22px 18px 110px; }
  .pay-summary{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:18px; }
  .pay-summary .row{ display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0; color:var(--ink-soft); }
  .pay-summary .row.total{ color:var(--ink); font-weight:700; font-size:15px; border-top:1px solid var(--line); margin-top:6px; padding-top:12px; }
  .amount-box{ background:var(--gold-grad); border-radius:16px; padding:16px 18px; margin-bottom:16px; text-align:center; box-shadow:0 8px 22px rgba(232,169,59,.3); }
  .amount-lbl{ font-size:12.5px; font-weight:700; color:var(--ink-dark); opacity:.85; margin-bottom:4px; }
  .amount-val{ font-family:'Inter','Noto Serif Ethiopic',serif; font-size:34px; font-weight:800; color:var(--ink-dark); font-variant-numeric:tabular-nums; }
  .amount-val span{ font-size:16px; font-weight:700; }
  .telebirr-card{ background:var(--teal-grad); color:var(--ink-dark); border-radius:18px; padding:20px; margin-bottom:16px; box-shadow:0 10px 28px rgba(15,174,89,.35); }
  .telebirr-card .tb-label{ font-size:12.5px; opacity:.9; margin-bottom:10px; font-weight:600; }
  .telebirr-number-row{ display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,.15); border-radius:11px; padding:12px 14px; margin-bottom:10px; }
  .telebirr-number{ font-family:'Inter','Noto Serif Ethiopic',serif; font-size:23px; font-weight:800; letter-spacing:0.02em; }
  .copy-btn{ background:#fff; color:var(--teal); border:none; border-radius:8px; padding:8px 12px; font-size:12.5px; font-weight:700; cursor:pointer; transition:transform .12s ease; }
  .copy-btn:hover{ transform:translateY(-1px); }
  .tb-steps{ font-size:13px; line-height:1.7; opacity:.97; margin:0; padding-right:18px; }
  .ref-note{ font-size:13px; background:rgba(255,255,255,.15); border-radius:9px; padding:10px 12px; margin-top:12px; }

  /* ---- upload ---- */
  .upload-wrap{ padding:22px 18px 110px; }
  .drop-zone{ border:1.5px dashed var(--line); border-radius:14px; background:var(--card); padding:30px 16px; text-align:center; cursor:pointer; margin-bottom:16px; transition:border-color .15s ease, background .15s ease; }
  .drop-zone:hover{ border-color:var(--teal); background:var(--teal-soft); }
  .drop-zone.has-file{ border-color:var(--teal); }
  .drop-zone svg{ margin-bottom:8px; }
  .drop-zone .dz-text{ font-size:13.5px; color:var(--ink-soft); }
  .receipt-preview{ width:100%; max-height:260px; object-fit:contain; border-radius:12px; margin-bottom:14px; background:var(--card-2); }

  /* ---- entry / winners cards ---- */
  .entry-card{
    background:var(--card); border:1px solid var(--line); border-radius:16px; margin:0 18px 14px; padding:16px;
    box-shadow:var(--shadow-sm); transition:transform .15s ease, box-shadow .15s ease; cursor:pointer;
    animation:slideFadeIn .35s ease backwards;
  }
  .entry-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); }
  .entry-card:active{ transform:scale(.99); }
  .entry-card.winner{ border-color:var(--gold); background:linear-gradient(135deg,rgba(232,169,59,.22),rgba(232,169,59,.06)); box-shadow:0 8px 22px rgba(201,140,34,.25); }
  .entry-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
  .entry-prize{ font-weight:700; font-size:14.5px; }
  .entry-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; font-variant-numeric:tabular-nums; }
  .status-badge{ font-size:11.5px; font-weight:700; padding:4px 11px; border-radius:20px; white-space:nowrap; }
  .status-pending_payment{ background:var(--amber-soft); color:var(--gold); }
  .status-submitted{ background:var(--amber-soft); color:var(--gold); }
  .status-confirmed{ background:var(--teal-soft); color:var(--teal); }
  .status-rejected{ background:var(--red-soft); color:var(--red); }
  .status-winner{ background:var(--gold-grad); color:var(--ink-dark); }
  .winner-banner{ text-align:center; padding:54px 30px 20px; }
  .winner-banner .big-ic{ font-size:52px; display:block; margin-bottom:8px; }
  .winner-banner .serif{ font-size:22px; margin:6px 0 8px; }
  .winner-banner p{ color:var(--ink-soft); font-size:14px; line-height:1.6; }
  .empty{ text-align:center; color:var(--ink-soft); padding:50px 30px; font-size:14.5px; }
  .empty .serif{ font-size:19px; color:var(--ink); display:block; margin-bottom:6px; }

  .wcard{ display:flex; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); align-items:center; transition:background .15s ease; animation:slideFadeIn .35s ease backwards; }
  .wcard:hover{ background:rgba(34,221,121,.06); }
  .wcard .wtrophy{ font-size:22px; flex-shrink:0; width:26px; text-align:center; }
  .wcard img{ width:54px; height:54px; border-radius:12px; object-fit:cover; background:var(--amber-soft); box-shadow:0 3px 10px rgba(0,0,0,.35); }
  .wcard .wname{ font-weight:700; font-size:14px; }
  .wcard .wmeta{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .wcard .wguess{ font-family:'Inter','Noto Serif Ethiopic',serif; color:var(--teal); font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; }

  /* ---- bottom tab nav ---- */
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; max-width:var(--content-w); margin:0 auto;
    background:rgba(10,22,32,.9); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line); display:flex; box-shadow:0 -6px 20px rgba(0,0,0,.4);
  }
  .tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 4px 8px; cursor:pointer; color:var(--ink-soft); font-size:11px; position:relative; transition:color .12s ease, transform .12s ease; }
  .tab:hover{ color:var(--teal); transform:translateY(-1px); }
  .tab.active{ color:var(--teal); }
  .tab svg{ width:20px; height:20px; }
  .tab .badge{ position:absolute; top:4px; right:22%; background:var(--red); color:#fff; font-size:10px; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px; }

  /* ---- admin ---- */
  .admin-subnav{ display:flex; gap:8px; padding:0 18px 12px; }
  .admin-subnav button{ flex:1; padding:9px; border-radius:10px; border:1px solid var(--line); background:var(--card); font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-soft); font-family:'Noto Sans Ethiopic',sans-serif; transition:border-color .12s ease; }
  .admin-subnav button:hover{ border-color:var(--teal); }
  .admin-subnav button.active{ background:var(--gold-grad); color:var(--ink-dark); border-color:transparent; }
  .img-picker{ display:flex; gap:10px; align-items:center; }
  .img-picker img{ width:64px; height:64px; border-radius:10px; object-fit:cover; background:var(--amber-soft); }
  .file-btn{ border:1px solid var(--line); background:var(--card-2); color:var(--ink); border-radius:10px; padding:10px 14px; font-size:13px; cursor:pointer; font-family:'Noto Sans Ethiopic',sans-serif; transition:border-color .12s ease; }
  .file-btn:hover{ border-color:var(--teal); }
  .admin-entry{
    background:var(--card); border:1px solid var(--line); border-radius:14px; margin:0 18px 12px; padding:14px;
    transition:transform .15s ease, box-shadow .15s ease; animation:slideFadeIn .35s ease backwards;
  }
  .admin-entry:hover{ box-shadow:var(--shadow-md); }
  .admin-entry .ae-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }

/* ============ REALTIME SYNC ============ */
function _maybeFinishLoading(){
  if (state._roundsReady && state._entriesReady && !state.loaded){ state.loaded = true; render(); }
}
function setupRealtimeSync(){
  db.collection('game_rounds').orderBy('createdAt','desc').onSnapshot(snap=>{
    state.rounds = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    state._roundsReady = true;
    if (state.loaded) render(); else _maybeFinishLoading();
  }, err=>{ console.error(err); showToast(t('error_load_rounds')); });

  db.collection('game_entries').orderBy('createdAt','desc').onSnapshot(snap=>{
    state.entries = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    state._entriesReady = true;
    if (state.loaded) render(); else _maybeFinishLoading();
  }, err=>{ console.error(err); showToast(t('error_load_entries')); });
}
async function fsSaveRound(r){ try{ await db.collection('game_rounds').doc(r.id).set(r); } catch(e){ console.error(e); showToast(t('error_save_round')); } }
async function fsSaveEntry(e){ try{ await db.collection('game_entries').doc(e.id).set(e); } catch(e2){ console.error(e2); showToast(t('error_save_entry')); } }
async function fsDeleteRound(id){
  try {
    const snap = await db.collection('game_entries').where('roundId','==',id).get();
    const batch = db.batch();
    snap.forEach(doc=>batch.delete(doc.ref));
    batch.delete(db.collection('game_rounds').doc(id));
    await batch.commit();
  } catch(e){ console.error(e); showToast(t('error_delete_round')); }
}
async function fsResetAll(){
  try {
    const [roundsSnap, entriesSnap] = await Promise.all([
      db.collection('game_rounds').get(),
      db.collection('game_entries').get(),
    ]);
    const allRefs = [...roundsSnap.docs.map(d=>d.ref), ...entriesSnap.docs.map(d=>d.ref)];
    for (let i=0;i<allRefs.length;i+=450){
      const batch = db.batch();
      allRefs.slice(i,i+450).forEach(ref=>batch.delete(ref));
      await batch.commit();
    }
  } catch(e){ console.error(e); showToast(t('error_clear_data')); }
}

/* ============ HELPERS ============ */
function fmt(n){ return Number(n).toLocaleString('en-US'); }
function fmtGuess(n){ return Number(n).toFixed(2); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function val(id){ const el=document.getElementById(id); return el ? el.value.trim() : ''; }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 1800); }
function go(screen){ state.screen = screen; render(); window.scrollTo(0,0); }
function savePlayer(name, phone){ state.player = { name, phone }; localStorage.setItem('game_player', JSON.stringify(state.player)); }
function addMyEntryLocal(id){ state.myEntryIds.push(id); localStorage.setItem('game_my_entries', JSON.stringify(state.myEntryIds)); }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return escapeHtml(s); }
function fmtCountdown(ms){
  if (ms<0) ms=0;
  const totalSec = Math.floor(ms/1000);
  const d = Math.floor(totalSec/86400);
  const h = Math.floor((totalSec%86400)/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  const p = n=>String(n).padStart(2,'0');
  if (d>0) return `${d} ${d===1?t('day_one'):t('day_many')} ${p(h)}:${p(m)}:${p(s)}`;
  return h>0 ? `${p(h)}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
}
function maskPhone(p){ p = String(p||''); return p.length>=6 ? p.slice(0,4)+'***'+p.slice(-2) : p; }
function tgFullName(){
  if (!tgUser) return '';
  return [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ').trim();
}
function parseGuessInput(str){
  if (str === '' || str === null || str === undefined) return null;
  const n = parseFloat(str);
  if (!isFinite(n)) return null;
  const rounded = Math.round(n*100)/100;
  if (rounded < 1 || rounded > 1000) return null;
  return rounded;
}
function resizeImageFile(file, maxW, cb){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function copyNumber(){
  if (navigator.clipboard) navigator.clipboard.writeText(TELEBIRR_NUMBER).then(()=>showToast(t('copy_number_toast')));
  else showToast(TELEBIRR_NUMBER);
}
function getOpenRounds(){ return state.rounds.filter(r=>r.status==='open').sort((a,b)=>a.endAt-b.endAt); }
function entriesForRound(id){ return state.entries.filter(e=>e.roundId===id); }
function statusLabel(s){ return t('status_'+s) || s; }
function prizeImg(r){ return r.prizeImage || 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect width=%22200%22 height=%22200%22 fill=%22%231A2F3D%22/></svg>'; }

function launchConfetti(){
  const colors = ['#E8A93B','#1B6B5A','#C1523D','#F5C77A','#238C74'];
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9998;';
  for (let i=0;i<44;i++){
    const p = document.createElement('div');
    const size = 6+Math.random()*6;
    p.className = 'confetti-piece';
    p.style.left = (Math.random()*100)+'%';
    p.style.width = size+'px';
    p.style.height = (size*0.4)+'px';
    p.style.background = colors[i%colors.length];
    p.style.opacity = (0.7+Math.random()*0.3).toFixed(2);
    p.style.transform = `rotate(${Math.random()*360}deg)`;
    p.style.animation = `confettiFall ${(2.2+Math.random()*1.6).toFixed(2)}s linear ${(Math.random()*0.5).toFixed(2)}s forwards`;
    wrap.appendChild(p);
  }
  document.body.appendChild(wrap);
  setTimeout(()=>wrap.remove(), 4200);
}

function maybeLaunchConfetti(){

function tickTimer(){

  rounds.forEach(round=>{

    const box = document.getElementById('timerBox-'+round.id);
    const remain = round.endAt - Date.now();
    if (remain <= 0){ anyExpired = true; return; }
    el.textContent = fmtCountdown(remain);
    if (box) box.classList.toggle('urgent', remain < 60000);
  });
  if (anyExpired) render();
}

  <div class="topbar"><div class="brand"><div class="name">${t('winners_title')}</div></div></div>
  ${closed.length===0 ? `<div class="empty"><span class="serif">${t('empty_no_winners_title')}</span>${t('empty_no_winners_sub')}</div>` :
  closed.map(r=>{
    const winner = r.winnerEntryId ? state.entries.find(e=>e.id===r.winnerEntryId) : null;
    return `
    <div class="wcard">
      <span class="wtrophy">${winner ? '🏆' : '➖'}</span>
      <img src="${prizeImg(r)}">
      <div style="flex:1;">
        <div class="wname">${escapeHtml(r.prizeName)}</div>
        <div class="wmeta">${winner ? escapeHtml(winner.name)+' &middot; '+maskPhone(winner.phone) : t('no_unique_winner')}</div>
      </div>
      ${winner ? `<div class="wguess">${fmtGuess(winner.guess)}</div>` : ''}
    </div>`;
  }).join('')}
  ${renderTabbar('winners')}`;
}

/* ============ ADMIN ============ */
function renderAdmin(){
  if (!state.isAdmin){ go('home'); return ''; }
  const sub = state._adminTab || 'round';
  return `
  <div class="section-title">${t('admin_title')}</div>
  <div class="admin-subnav">
    <button class="${sub==='round'?'active':''}" onclick="state._adminTab='round'; render();">${t('admin_tab_active_rounds')}</button>
    <button class="${sub==='history'?'active':''}" onclick="state._adminTab='history'; render();">${t('admin_tab_history')}</button>
  </div>
  ${sub==='round' ? renderAdminRound() : renderAdminHistory()}
  ${renderTabbar('')}`;
}
function renderAdminRound(){
  const rounds = getOpenRounds();
  return `
  <div class="form-wrap" style="padding:4px 18px 16px;">
    <button class="btn-primary" onclick="state.pendingImageData=null; go('admin-round-new')">${t('btn_new_round')}</button>
  </div>
  ${rounds.length===0 ? `<div class="empty">${t('no_open_round_admin')}</div>` :
  rounds.map(round=>{
    const remain = round.endAt - Date.now();
    const entries = entriesForRound(round.id);
    const confirmedCount = entries.filter(e=>e.status==='confirmed').length;
    const progressPct = entries.length ? Math.round(confirmedCount/entries.length*100) : 0;
    return `
    <div class="admin-entry" style="cursor:pointer;" onclick="state.managingRoundId='${round.id}'; go('admin-round-detail')">
      <div class="ae-top">
        <div>
          <div class="ae-name">${escapeHtml(round.prizeName)}</div>
          <div class="ae-phone">${t('stat_participants')} ${entries.length} &middot; ${t('stat_entry_fee')} ${fmt(round.entryFee)}</div>
        </div>
        <span class="status-badge status-confirmed">🕒 ${remain>0?fmtCountdown(remain):'00:00'}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%;"></div></div>
      <div class="progress-lbl"><span>${t('progress_confirmed_payment')}</span><span>${confirmedCount}/${entries.length}</span></div>
    </div>`;
  }).join('')}`;
}
function renderAdminRoundNew(){
  if (!state.isAdmin){ go('home'); return ''; }
  const img = state.pendingImageData;
  return `
  <div class="back-btn"><button onclick="state._adminTab='round'; go('admin')">&rarr; ${t('back')}</button></div>
  <div class="form-wrap" style="padding-top:14px;">
    <h2 class="serif" style="margin:0 0 16px;">${t('new_round_title')}</h2>
    <div class="field">
      <label>${t('label_prize_image')}</label>
      <div class="img-picker">
        <img src="${img || 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22><rect width=%2260%22 height=%2260%22 fill=%22%231A2F3D%22/></svg>'}">
        <button class="file-btn" onclick="document.getElementById('prizeImgFile').click()">${t('btn_choose_image')}</button>
        <input type="file" id="prizeImgFile" accept="image/*" style="display:none" onchange="onPrizeImageChosen(event)">
      </div>
    </div>
    <div class="field"><label>${t('label_prize_name')}</label><input type="text" id="prizeName" placeholder="${t('placeholder_prize_name')}"></div>
    <div class="field"><label>${t('label_prize_desc')}</label><textarea id="prizeDesc" placeholder="${t('placeholder_short_desc')}"></textarea></div>
    <div class="field"><label>${t('label_entry_fee')}</label><input type="number" id="entryFee" placeholder="${t('placeholder_eg50')}"></div>
    <div class="field">
      <label>${t('label_duration')}</label>
      <div style="display:flex; gap:8px;">
        <input type="number" id="durationVal" placeholder="${t('placeholder_eg2')}" style="flex:1;">
        <select id="durationUnit" style="flex:1; border:1.5px solid var(--line); border-radius:11px; padding:12px 13px; font-size:14.5px; font-family:'Noto Sans Ethiopic',sans-serif; background:var(--card-2); color:var(--ink);">
          <option value="minutes">${t('unit_minutes')}</option>
          <option value="hours">${t('unit_hours')}</option>
          <option value="days" selected>${t('unit_days')}</option>
        </select>
      </div>
    </div>
  </div>
  <div class="fixed-bar"><button class="btn-primary" onclick="createRound()">${t('btn_start_round')}</button></div>`;
}
function renderAdminRoundDetail(){
  if (!state.isAdmin){ go('home'); return ''; }
  const round = state.rounds.find(r=>r.id===state.managingRoundId);
  if (!round){ state._adminTab='round'; go('admin'); return ''; }
  const remain = round.endAt - Date.now();
  const entries = entriesForRound(round.id);
  const confirmedCount = entries.filter(e=>e.status==='confirmed').length;
  const progressPct = entries.length ? Math.round(confirmedCount/entries.length*100) : 0;
  return `
  <div class="back-btn"><button onclick="state._adminTab='round'; go('admin')">&rarr; ${t('back')}</button></div>
  <div class="round-wrap" style="padding-top:10px;">
    <div class="prize-card">
      <div class="prize-media">
        <img src="${prizeImg(round)}" alt="">
        <div class="prize-ribbon">🏆 ${escapeHtml(round.prizeName)}</div>
      </div>
      <div class="prize-body">
        <div class="stat-row">
          <div class="stat-box timer"><div class="stat-val">${remain>0?fmtCountdown(remain):'00:00'}</div><div class="stat-lbl">${t('stat_time_left')}</div></div>
          <div class="stat-box"><div class="stat-val">${entries.length}</div><div class="stat-lbl">${t('stat_participants')}</div></div>
          <div class="stat-box"><div class="stat-val">${confirmedCount}</div><div class="stat-lbl">${t('label_confirmed')}</div></div>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%;"></div></div>
        <div class="progress-lbl"><span>${t('progress_confirmed_payment')}</span><span>${confirmedCount}/${entries.length}</span></div>
        <div class="field" style="margin:16px 0 0;">
          <label>${t('label_extend_time')}</label>
          <div style="display:flex; gap:8px;">
            <input type="number" id="extendVal" placeholder="${t('placeholder_eg15')}" style="flex:1;">
            <select id="extendUnit" style="flex:1; border:1.5px solid var(--line); border-radius:11px; padding:12px 13px; font-size:14.5px; font-family:'Noto Sans Ethiopic',sans-serif; background:var(--card-2); color:var(--ink);">
              <option value="minutes" selected>${t('unit_minutes')}</option>
              <option value="hours">${t('unit_hours')}</option>
              <option value="days">${t('unit_days')}</option>
            </select>
            <button class="btn-secondary" style="flex:0 0 auto; padding:12px 16px;" onclick="extendRound('${round.id}')">${t('btn_extend')}</button>
          </div>
        </div>
        <button class="btn-danger" style="width:100%; border-radius:12px; padding:12px; font-weight:600; margin-top:12px;" onclick="closeRoundAndAnnounce('${round.id}')">${t('btn_close_round')}</button>
      </div>
    </div>
  </div>
  <div class="section-title" style="padding-top:6px;">${t('section_participants')}</div>
  ${entries.length===0 ? `<div class="empty">${t('empty_no_participants')}</div>` :
  entries.map(e=>`
    <div class="admin-entry">
      <div class="ae-top">
        <div><div class="ae-name">${escapeHtml(e.name)}</div><div class="ae-phone">${escapeHtml(e.phone)}</div></div>
        <span class="status-badge status-${e.status}">${statusLabel(e.status)}</span>
      </div>
      <div class="ae-guess">${fmtGuess(e.guess)}</div>
      ${e.note ? `<div class="note-box">"${escapeHtml(e.note)}"</div>` : ''}
      ${e.receipt ? `<img class="receipt-thumb" src="${e.receipt}">` : `<div style="font-size:12.5px; color:var(--ink-soft);">${t('receipt_not_uploaded')}</div>`}
      ${e.status==='submitted' ? `
      <div class="admin-actions">
        <button class="btn-danger" onclick="setEntryStatus('${e.id}','rejected')">${t('btn_reject')}</button>
        <button class="btn-primary" style="flex:1;" onclick="setEntryStatus('${e.id}','confirmed')">${t('btn_confirm')}</button>
      </div>` : ''}
    </div>`).join('')}`;
}
function onPrizeImageChosen(e){
  const file = e.target.files[0];
  if (!file) return;
  resizeImageFile(file, 700, (dataUrl)=>{ state.pendingImageData = dataUrl; render(); });
}
function createRound(){
  const prizeName = val('prizeName');
  const prizeDesc = val('prizeDesc');
  const entryFee = parseFloat(val('entryFee'));
  const durationVal = parseFloat(val('durationVal'));
  const durationUnit = (document.getElementById('durationUnit')||{}).value || 'minutes';
  const unitMinutes = { minutes:1, hours:60, days:1440 }[durationUnit] || 1;
  const durationMin = durationVal * unitMinutes;
  if (!prizeName){ showToast(t('toast_prize_name_required')); return; }
  if (!entryFee || entryFee<=0){ showToast(t('toast_valid_fee')); return; }
  if (!durationVal || durationVal<=0){ showToast(t('toast_valid_duration')); return; }
  const round = {
    id: uid(), prizeName, prizeDesc, prizeImage: state.pendingImageData || null,
    entryFee, durationMinutes: durationMin,
    startAt: Date.now(), endAt: Date.now() + durationMin*60000,
    status: 'open', winnerEntryId: null, createdAt: Date.now(),
  };
  state.rounds.unshift(round);
  fsSaveRound(round);
  state.pendingImageData = null;
  showToast(t('toast_round_started'));
  state._adminTab = 'round';
  go('admin');
}
function setEntryStatus(id, status){
  const e = state.entries.find(x=>x.id===id);
  if (!e) return;
  e.status = status;
  fsSaveEntry(e);
  showToast(status==='confirmed' ? t('toast_confirmed') : t('toast_rejected'));
  render();
}
function extendRound(roundId){
  const round = state.rounds.find(r=>r.id===roundId);
  if (!round) return;
  const extendVal = parseFloat(val('extendVal'));
  const extendUnit = (document.getElementById('extendUnit')||{}).value || 'minutes';
  const unitMinutes = { minutes:1, hours:60, days:1440 }[extendUnit] || 1;
  if (!extendVal || extendVal<=0){ showToast(t('toast_valid_time')); return; }
  const base = round.endAt > Date.now() ? round.endAt : Date.now();
  round.endAt = base + extendVal*unitMinutes*60000;
  fsSaveRound(round);
  showToast(t('toast_extended'));
  render();
}
function closeRoundAndAnnounce(roundId){
  const round = state.rounds.find(r=>r.id===roundId);
  if (!round) return;
  if (!confirm(t('confirm_close_round'))) return;
  const confirmed = entriesForRound(round.id).filter(e=>e.status==='confirmed');
  const counts = {};
  confirmed.forEach(e=>{ counts[e.guess] = (counts[e.guess]||0) + 1; });
  const uniqueEntries = confirmed.filter(e=>counts[e.guess]===1).sort((a,b)=>a.guess-b.guess);
  const winner = uniqueEntries[0] || null;
  round.status = 'closed';
  round.closedAt = Date.now();
  round.winnerEntryId = winner ? winner.id : null;
  fsSaveRound(round);
  if (winner){ winner.status = 'winner'; fsSaveEntry(winner); }
  showToast(winner ? t('toast_winner_announced',{name:winner.name, guess:fmtGuess(winner.guess)}) : t('toast_no_unique_winner'));
  state._adminTab = 'round';
  go('admin');
}
function renderAdminHistory(){
  const closed = state.rounds.filter(r=>r.status==='closed').sort((a,b)=>(b.closedAt||0)-(a.closedAt||0));
  return `
  <div class="form-wrap" style="padding:4px 18px 6px;">
    <button onclick="resetAllData()" style="width:100%; background:var(--card); border:1.5px solid var(--red); color:var(--red); border-radius:12px; padding:12px; font-weight:700; font-size:13.5px; cursor:pointer; font-family:'Noto Sans Ethiopic',sans-serif;">${t('btn_clear_all_data')}</button>
  </div>
  ${closed.length===0 ? `<div class="empty">${t('empty_no_closed_rounds')}</div>` :
  closed.map(r=>{
    const winner = r.winnerEntryId ? state.entries.find(e=>e.id===r.winnerEntryId) : null;
    const total = entriesForRound(r.id).length;
    return `
    <div class="admin-entry">
      <div class="ae-top">
        <div><div class="ae-name">${escapeHtml(r.prizeName)}</div><div class="ae-phone">${total} ${t('word_participants')} &middot; ${fmt(r.entryFee)} ${t('currency')}</div></div>
        <div style="display:flex; gap:6px; flex-shrink:0;">
          <button onclick="editHistoryRound('${r.id}')" style="border:1px solid var(--line); background:var(--card); border-radius:8px; padding:7px 10px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:'Noto Sans Ethiopic',sans-serif; color:var(--ink-soft);">${t('btn_edit')}</button>
          <button onclick="deleteHistoryRound('${r.id}')" style="border:1px solid var(--red); background:var(--card); border-radius:8px; padding:7px 10px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:'Noto Sans Ethiopic',sans-serif; color:var(--red);">${t('btn_delete')}</button>
        </div>
      </div>
      ${winner ? `<div class="kv"><span>${t('kv_winner')}</span><b>${escapeHtml(winner.name)} (${escapeHtml(winner.phone)}) &mdash; ${fmtGuess(winner.guess)}</b></div>` : `<div class="kv"><span>${t('kv_result')}</span><b>${t('no_unique_winner')}</b></div>`}
    </div>`;
  }).join('')}`;
}
function editHistoryRound(id){ state.editingRoundId = id; go('admin-history-edit'); }
function deleteHistoryRound(id){
  if (!confirm(t('confirm_delete_round'))) return;
  state.rounds = state.rounds.filter(r=>r.id!==id);
  state.entries = state.entries.filter(e=>e.roundId!==id);
  fsDeleteRound(id);
  showToast(t('toast_round_deleted'));
  render();
}
function resetAllData(){
  if (!confirm(t('confirm_reset_all'))) return;
  if (!confirm(t('confirm_final'))) return;
  state.rounds = [];
  state.entries = [];
  fsResetAll();
  showToast(t('toast_all_data_cleared'));
  render();
}
function renderAdminHistoryEdit(){
  if (!state.isAdmin){ go('home'); return ''; }
  const round = state.rounds.find(r=>r.id===state.editingRoundId);
  if (!round){ state._adminTab='history'; go('admin'); return ''; }
  const candidates = entriesForRound(round.id).filter(e=>e.status==='confirmed' || e.status==='winner').sort((a,b)=>a.guess-b.guess);
  const rowStyle = active => `display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border:1.5px solid ${active?'var(--teal)':'var(--line)'}; border-radius:12px; cursor:pointer; margin-bottom:8px; background:${active?'var(--teal-soft)':'var(--card)'};`;
  return `
  <div class="back-btn"><button onclick="state._adminTab='history'; go('admin')">&rarr; ${t('admin_tab_history')}</button></div>
  <div class="form-wrap" style="padding-top:4px;">
    <h2 class="serif" style="margin:10px 0 6px;">${t('edit_winner_title',{prize:escapeHtml(round.prizeName)})}</h2>
    <p style="color:var(--ink-soft); font-size:13.5px; margin:0 0 18px;">${t('edit_winner_sub')}</p>
    <label style="${rowStyle(!round.winnerEntryId)}" onclick="setHistoryWinner(null)">
      <span style="display:flex; align-items:center; gap:10px;"><input type="radio" name="winnerPick" ${!round.winnerEntryId?'checked':''}><span>${t('no_one_won')}</span></span>
    </label>
    ${candidates.length===0 ? `<div class="empty" style="padding:24px 0;">${t('empty_no_confirmed_participants')}</div>` :
    candidates.map(e=>`
    <label style="${rowStyle(round.winnerEntryId===e.id)}" onclick="setHistoryWinner('${e.id}')">
      <span style="display:flex; align-items:center; gap:10px;"><input type="radio" name="winnerPick" ${round.winnerEntryId===e.id?'checked':''}><span>${escapeHtml(e.name)} &middot; ${escapeHtml(e.phone)}</span></span>
      <b style="font-family:'Noto Serif Ethiopic',serif; color:var(--teal); font-variant-numeric:tabular-nums;">${fmtGuess(e.guess)}</b>
    </label>`).join('')}
  </div>`;
}
function setHistoryWinner(entryId){
  const round = state.rounds.find(r=>r.id===state.editingRoundId);
  if (!round) return;
  const prevWinnerId = round.winnerEntryId || null;
  if (prevWinnerId === entryId) return;
  if (prevWinnerId){
    const prev = state.entries.find(e=>e.id===prevWinnerId);
    if (prev){ prev.status = 'confirmed'; fsSaveEntry(prev); }
  }
  round.winnerEntryId = entryId || null;
  if (entryId){
    const next = state.entries.find(e=>e.id===entryId);
    if (next){ next.status = 'winner'; fsSaveEntry(next); }
  }
  fsSaveRound(round);
  showToast(t('toast_winner_updated'));
  render();
}

/* ============ ROUTER ============ */
function render(){
  const app = document.getElementById('app');
  if (!state.loaded){ app.innerHTML = `<div class="loading-wrap"><div class="spinner"></div><span>${t('loading')}</span></div>`; return; }
  const map = {
    'home': renderHome, 'join': renderJoin, 'pay': renderPay, 'upload': renderUpload, 'status': renderStatus,
    'myentry': renderMyEntry, 'entry-detail': renderEntryDetail, 'winners': renderWinners,
    'admin': renderAdmin, 'admin-round-new': renderAdminRoundNew, 'admin-round-detail': renderAdminRoundDetail,
    'admin-history-edit': renderAdminHistoryEdit,
  };
  const fn = map[state.screen] || renderHome;
  app.innerHTML = fn();
  maybeLaunchConfetti();
}

/* ============ BOOT ============ */
(function boot(){
  document.documentElement.lang = LANG;
  render();
  setupRealtimeSync();
})();
</script>
